site_name: Infinity v3
site_url: https://michaelfeil.eu/infinity/
site_description: Native Rust and LibTorch serving for embeddings, reranking and decision models.
repo_url: https://github.com/michaelfeil/infinity/
edit_uri: edit/main/docs/v3/
docs_dir: v3
site_dir: ../site-v3

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit

nav:
  - Overview: README.md
  - Get started:
      - Quickstart: quickstart.md
      - CLI and requests: docs/cli.md
      - Supported models: docs/libtorch-model-coverage.md
      - API: api.md
  - Reference:
      - Embedding formats: docs/embedding-tensors.md
      - Build configuration: docs/build-configuration.md
      - Licensing: LICENSING.md
  - Internals:
      - LibTorch backend: docs/libtorch-backend.md
      - Prefix caching: docs/libtorch-prefix-cache.md
      - Startup performance: docs/modernbert-startup.md
      - Development: CONTRIBUTING.md
  - Python / v2 docs: https://michaelfeil.eu/infinity/latest/

plugins:
  - search
  - gen-files:
      scripts: [gen_v3_docs.py]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
