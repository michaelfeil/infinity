name: Auto generate Client Code

on:
  push:
    branches: [main]
    paths:
      - 'libs/client_infinity/**'
      - 'libs/infinity_emb/**'
      - '.github/workflows/generate_client.yaml'
      - '.github/actions/poetry_setup/**'

env:
  POETRY_VERSION: "2.5.1"

jobs:
  generate-client:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python + Poetry ${{ env.POETRY_VERSION }}
        uses: "$/.github/actions/poetry_setup"
        with:
          python-version: "3.12"
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: libs/client_infinity
          cache-key: client-generation

      - name: Install infinity
        run: |
          pip install libs/infinity_emb[all]

      - name: Generate Client
        working-directory: libs/client_infinity
        run: |
          ./run_generate_with_hook.sh

      - name: Test Generated Client
        working-directory: libs/client_infinity
        run: |
          ./run_tests_with_hook.sh

      - name: Open a PR
        uses: peter-evans/create-pull-request@v7.0.11
