name: docs-gh-pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'libs/infinity_emb/**'
      - 'libs/infinity-v3/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'libs/infinity-v3/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, '0.') || startsWith(github.event.release.tag_name, 'v0.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --config-file docs/mkdocs.yml
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/site/

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: infinity-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Publish documentation
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$EVENT_NAME" = release ]; then
            version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("libs/infinity_emb/pyproject.toml").read_text())["tool"]["poetry"]["version"])')
            mike deploy --config-file docs/mkdocs.yml --push --update-aliases "$version" latest --alias-type=redirect
          else
            mike deploy --config-file docs/mkdocs.yml --push main
          fi
