name: docs-v3-pages

on:
  push:
    branches: [main]
    paths:
      - 'libs/infinity-v3/**'
      - 'docs/v3/**'
      - 'docs/*v3*'
      - '.github/workflows/docs-v3.yaml'
  pull_request:
    paths:
      - 'libs/infinity-v3/**'
      - 'docs/v3/**'
      - 'docs/*v3*'
      - '.github/workflows/docs-v3.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements-v3.txt
      - run: pip install -r docs/requirements-v3.txt
      - run: mkdocs build --strict --config-file docs/mkdocs-v3.yml
      - uses: actions/upload-artifact@v4
        with:
          name: docs-v3-preview
          path: site-v3/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: infinity-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements-v3.txt
      - run: pip install -r docs/requirements-v3.txt
      - name: Publish v3 without changing the default
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mike deploy --config-file docs/mkdocs-v3.yml --push --title 'Infinity v3 (preview)' v3
