# workflow to deploy infra/modal/webserver.py to modal.com

name: release_modal_com

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Python version from the triggering release tag (optional leading v)"

jobs:
  modal:
    runs-on: ubuntu-latest
    environment:
      name: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free Disk Space
        uses: "./.github/actions/disk_cleanup"
        if: runner.os == 'Linux'
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install modal
        run: |
          python -m pip install --upgrade pip
          pip install modal==1.1.3
          modal token set --token-id ${{ secrets.MODAL_TOKEN_ID }} --token-secret ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Modal Deploy
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION_INF="${RELEASE_VERSION#v}" CI_DEPLOY_INF=true modal deploy --tag "${RELEASE_VERSION}-github-ci" --env prod infra.modal.webserver
