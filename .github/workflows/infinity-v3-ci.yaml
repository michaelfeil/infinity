name: Infinity v3 CI

on:
  push:
    branches: [main]
    paths:
      - 'libs/infinity-v3/**'
      - '.github/workflows/infinity-v3-ci.yaml'
  pull_request:
    paths:
      - 'libs/infinity-v3/**'
      - '.github/workflows/infinity-v3-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libs/infinity-v3

env:
  CARGO_TERM_COLOR: always

jobs:
  native-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
          python -m pip install clang-tidy==20.1.0
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Configure CPU LibTorch compilation database
        run: |
          cmake -S backends/libtorch/cpp -B build/native-tidy \
            -DCMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DINFINITY_BUILD_NATIVE_TESTS=ON
      - name: Check native C++ correctness
        run: python scripts/check-native-tidy.py build/native-tidy

  native-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==20.1.8
      - name: Check C++ and CUDA formatting
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.cu' '*.cuh' |
            xargs -0 clang-format --dry-run --Werror

  cpu:
    runs-on: ubuntu-latest
    env:
      # Bundled Oniguruma uses pre-C23 function declarations.
      CFLAGS: -std=gnu17
    steps:
      - uses: actions/checkout@v6
      - name: Read Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust-toolchain.toml', 'rb') as file:
              print('version=' + tomllib.load(file)['toolchain']['channel'])
          PYTHON
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
          rust-src-dir: libs/infinity-v3
          cache-workspaces: libs/infinity-v3
          # Cached proc-macros run on different GitHub runner CPUs. Override
          # the project's native CPU flags so cached artifacts remain portable.
          rustflags: '-C target-cpu=x86-64'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler libssl-dev pkg-config
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -c 'import torch; from pathlib import Path; print("LIBTORCH=" + str(Path(torch.__file__).parent))' >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native runtime packaging
        run: python3 -m unittest discover -s scripts -p test_libtorch_packaging.py
      - name: Check FA4 host instruction portability
        run: python3 -m unittest discover -s scripts -p test_fa4_portability.py
      - name: Build default CPU server
        run: cargo build --locked
      - name: Build without default features
        run: cargo build --locked --no-default-features --features libtorch,http
      - name: Compile CPU integration tests
        run: cargo test --locked --no-run
      - name: Run CPU unit tests
        run: cargo test --locked --lib
      - name: Check lints
        run: cargo clippy --locked --lib --bins
      - name: Check CLI environment names and precedence
        run: cargo test --locked -p infinity_v3-router --bin infinity_v3
      - name: Check renamed environment base
        env:
          ENV_VAR_BASE: ACME
        run: |
          cargo test --locked -p infinity-v3-config
          cargo test --locked -p infinity_v3-router --bin infinity_v3

  python-backend:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -std=gnu17
    steps:
      - uses: actions/checkout@v6
      - name: Read Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust-toolchain.toml', 'rb') as file:
              print('version=' + tomllib.load(file)['toolchain']['channel'])
          PYTHON
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
          rust-src-dir: libs/infinity-v3
          cache-workspaces: libs/infinity-v3
          rustflags: '-C target-cpu=x86-64'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake protobuf-compiler libssl-dev pkg-config
          python -m pip install ./python
      - name: Build Python CPU server without LibTorch
        run: cargo build --locked -p infinity_v3-router --no-default-features --features python-backend,http
      - name: Run Python backend and shared frontend tests
        run: |
          cargo test --locked -p infinity-v3-backend-python -p infinity_v3-backend-core \
            -p infinity_v3-backend -p infinity_v3-core -p infinity_v3-router \
            --no-default-features --features python-backend,http --lib --bins
      - name: Check frontend without a compiled backend
        run: cargo check --locked -p infinity_v3-router --no-default-features --features http
      - name: Check Python feature lints
        run: cargo clippy --locked -p infinity_v3-router --no-default-features --features python-backend,http --lib --bins
