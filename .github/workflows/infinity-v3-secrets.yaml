name: Infinity v3 secret scanning

on:
  push:
    branches: [main]
    paths:
      - 'libs/infinity-v3/**'
      - '.github/workflows/infinity-v3-secrets.yaml'
  pull_request:
    paths:
      - 'libs/infinity-v3/**'
      - '.github/workflows/infinity-v3-secrets.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown --exclude-detectors=postgres
