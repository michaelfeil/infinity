[package]
# Fork license adoption; see the scoped workspace license bundle.
license-file.workspace = true
name = "infinity_v3-router"
description = "infinity_v3 inference server"
build = "build.rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "infinity_v3"
path = "src/main.rs"

[dependencies]
infinity-v3-config = { workspace = true }
anyhow = { workspace = true }
infinity_v3-backend = { path = "../backends", default-features = false, features = ["clap"] }
infinity_v3-core = { path = "../core" }
clap = { workspace = true }
futures = "^0.3"
init-tracing-opentelemetry = { version = "0.18.1", features = ["opentelemetry-otlp"] }
hf-hub = { workspace = true }
http = "1.0.0"
num_cpus = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.15.1", features = [] }
opentelemetry = "0.23.0"
opentelemetry_sdk = { version = "0.23.0", features = ["rt-tokio"] }
opentelemetry-otlp = "0.16.0"
reqwest = { version = "0.12.5", features = [] }
simsimd = "4.4.0"
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = "0.24.0"
tracing-subscriber = { version = "0.3.16", features = ["json", "env-filter"] }
veil = "0.1.6"
uuid = { version = "1", features = ["v4"] }

# HTTP dependencies
http-body = { version = "1", optional = true }
axum = { version = "0.7.4", features = ["json"], optional = true }
axum-tracing-opentelemetry = { version = "0.18.1", optional = true }
base64 = { version = "0.22.1", optional = true }
rmp-serde = { version = "1.3", optional = true }
tower-http = { version = "0.5.1", features = ["cors"], optional = true }
utoipa = { version = "4.2", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "7.1", features = ["axum", "vendored"], optional = true }

# Optional
bigdecimal = { version = "0.4", default-features = false, features = ["std"] }

# Malloc trim hack for linux
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.149"
# else use mimalloc
[target.'cfg(not(target_os = "linux"))'.dependencies]
mimalloc = { version = "*", features = ["no_thp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
insta = { git = "https://github.com/OlivierDehaene/insta", rev = "f4f98c0410b91fb5a28b10df98e4422955be9c2c", features = ["yaml"] }
is_close = "0.1.3"
reqwest = { version = "0.12.5", features = ["json"] }
serial_test = { workspace = true }

[build-dependencies]
vergen = { version = "8.0.0", features = ["build", "git", "gitcl"] }

[features]
default = ["libtorch", "http"]
http = ["infinity_v3-core/openapi", "dep:axum", "dep:http-body", "dep:axum-tracing-opentelemetry", "dep:base64", "dep:rmp-serde", "dep:tower-http", "dep:utoipa", "dep:utoipa-swagger-ui"]
libtorch = ["infinity_v3-backend/libtorch"]
python-backend = ["infinity_v3-backend/python-backend"]
