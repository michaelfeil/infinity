[workspace]
members = [
    "config",
    "backends",
    "backends/core",
    "backends/libtorch",
    "backends/python",
    "core",
    "router",
]
default-members = [
    "backends",
    "backends/core",
    "backends/libtorch",
    "core",
    "router",
]
resolver = "2"

[workspace.package]
# Fork license adoption; inherited and third-party grants remain in LICENSE.
license-file = "LICENSE"
version = "3.0.2-beta.1"
edition = "2021"
authors = ["infinity authors"]
homepage = "https://github.com/michaelfeil/infinity"

[workspace.dependencies]
infinity-v3-config = { path = "config" }
anyhow = "1.0.75"
clap = { version = "4.1", features = ["derive", "env"] }
hf-hub = { version = "0.4", features = ["tokio"], default-features = false }
metrics = "0.23"
nohash-hasher = "0.2"
num_cpus = "1.16.0"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig", "esaxx_fast"] }
tokio = { version = "1.25", features = ["rt", "rt-multi-thread", "parking_lot", "sync", "signal"] }
tracing = "0.1"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.9"
serial_test = "2.0.0"
half = { version = "2.3.1", features = ["num-traits"] }
radix_mlp = { version = "0.0.2" }

[profile.release]
debug = 0
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = 1
lto = "thin"
codegen-units = 16
strip = "none"
