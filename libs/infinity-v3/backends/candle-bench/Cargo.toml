[package]
# Fork license adoption; see the scoped workspace license bundle.
license-file.workspace = true
name = "candle-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
infinity_v3-backend-candle = { path = "../candle" }
infinity_v3-backend = { path = ".." }
infinity_v3-backend-core = { path = "../core" }
infinity_v3-core = { path = "../../core" }
anyhow = { workspace = true }
cudarc = { workspace = true, optional = true }
hf-hub = { workspace = true , features = ["ureq"] }
radix_mlp = { workspace = true }
serde_json = "*"
tracing = "*"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "radix_mlp_benchmark"
harness = false

[features]
metal = ["infinity_v3-backend-candle/metal"]
cuda = ["infinity_v3-backend-candle/cuda", "infinity_v3-backend-candle/flash-attn", "dep:cudarc","cudarc?/dynamic-linking"]
candle = ["infinity_v3-backend/candle"]
