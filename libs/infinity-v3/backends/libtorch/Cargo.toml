[package]
# Fork license adoption; see the scoped workspace license bundle.
license-file.workspace = true
name = "infinity-backend-libtorch"
version.workspace = true
edition.workspace = true
authors.workspace = true
links = "infinity_torch"
autoexamples = false

[dependencies]
text-embeddings-backend-core = { package = "infinity_v3-backend-core", path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = "0.8"
sha2 = "0.10"
bytemuck = "1"
pytorch-reader = "=0.22.0"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
zip = { version = "8.6.0", default-features = false }
text-embeddings-backend-candle = { package = "infinity_v3-backend-candle", path = "../candle" }

[features]
benchmark-cuda = ["text-embeddings-backend-candle/cuda", "text-embeddings-backend-candle/flash-attn", "text-embeddings-backend-candle/cuda-dynamic-linking"]
benchmark-fp8 = ["benchmark-cuda", "text-embeddings-backend-candle/experimental-fp8"]

[[example]]
name = "compare_bert"
path = "tests/benchmarks/compare_bert.rs"
required-features = ["benchmark-cuda"]

[[example]]
name = "compare_gemma"
path = "tests/benchmarks/compare_gemma.rs"
required-features = ["benchmark-cuda"]

[[example]]
name = "compare_decoders"
path = "tests/benchmarks/compare_decoders.rs"
required-features = ["benchmark-cuda"]

[[example]]
name = "compare_decisions"
path = "tests/benchmarks/compare_decisions.rs"
required-features = ["benchmark-cuda"]

[[example]]
name = "compare_radix"
path = "tests/benchmarks/compare_radix.rs"
required-features = ["benchmark-cuda"]

[[example]]
name = "compare_heads"
path = "tests/benchmarks/compare_heads.rs"
required-features = ["benchmark-cuda"]
