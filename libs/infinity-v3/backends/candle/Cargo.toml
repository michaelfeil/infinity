[package]
# Fork license adoption; see the scoped workspace license bundle.
license-file.workspace = true
name = "infinity_v3-backend-candle"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
candle-flash-attn-v4 = { git = "https://github.com/michaelfeil/candle-flash-attn-v4", rev = "0f6c65849ad3b28b085940d5b31d325ed1df4902", optional = true }
anyhow = { workspace = true }
accelerate-src = { version = "0.3.2", optional = true }
intel-mkl-src = { workspace = true, optional = true }
candle = { workspace = true }
half = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
candle-flash-attn = { workspace = true, optional = true}
candle-flash-attn-v1 = { workspace = true, optional = true }
candle-cublaslt = { workspace = true, optional = true }
candle-index-select-cu = { workspace = true, optional = true}
candle-layer-norm = { workspace = true, optional = true }
candle-rotary = { workspace = true, optional = true }
nohash-hasher = { workspace = true }
infinity_v3-backend-core = { path = "../core" }
tracing = { workspace = true }
safetensors = "0.8"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = "^0.9"
sha2 = "0.10"
bytemuck = "1"

[dev-dependencies]
insta = { git = "https://github.com/OlivierDehaene/insta", rev = "f4f98c0410b91fb5a28b10df98e4422955be9c2c", features = ["yaml"] }
is_close = "0.1.3"
hf-hub = { workspace = true, features = ["ureq"] }
anyhow = { workspace = true }
tokenizers = { workspace = true }
serial_test = { workspace = true }

[build-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
cudaforge = { version = "0.1", optional = true }

[features]
experimental-fp8 = ["cuda", "candle-cublaslt/experimental-fp8"]
experimental-fa4 = ["fa4"]
fa4 = ["flash-attn", "dep:candle-flash-attn-v4"]
accelerate = ["dep:accelerate-src", "candle/accelerate", "candle-nn/accelerate"]
metal = ["candle/metal", "candle-nn/metal"]
mkl = ["dep:intel-mkl-src", "candle/mkl"]
cuda = ["candle/cuda", "candle-nn/cuda", "dep:candle-cublaslt", "dep:candle-layer-norm", "dep:candle-rotary", "dep:candle-index-select-cu", "dep:cudaforge"]
cuda-static-linking = ["candle/cuda-static-linking", "candle-flash-attn?/static-linking"]
cuda-dynamic-linking = ["candle/cuda-dynamic-linking"]
flash-attn-v1 = ["dep:candle-flash-attn-v1", "cuda"]
flash-attn = ["dep:candle-flash-attn", "cuda", "candle-transformers/flash-attn"]

experimental-deberta = ["cuda", "dep:candle-flash-attn-v4", "candle-flash-attn-v4/deberta"]
