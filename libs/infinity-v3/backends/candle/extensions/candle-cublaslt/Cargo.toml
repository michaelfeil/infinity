[package]
name = "candle-cublaslt"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
[features]
# Requires CUDA toolkit 12.9+; runtime validated on H100.
experimental-fp8 = ["dep:float8"]

[dependencies]
float8 = { version = "0.7", optional = true }
candle = { workspace = true, features = ["cuda"] }
half = { workspace = true }
cudarc = { workspace = true }
[build-dependencies]
anyhow = "1"
bindgen_cuda = "0.1.1"
num_cpus = "1.15"
rayon = "1.7"
[dev-dependencies]
anyhow = "1"
candle-nn = { workspace = true }

[[example]]
name = "fp8_linear"
required-features = ["experimental-fp8"]
