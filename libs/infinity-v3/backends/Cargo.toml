[package]
# Fork license adoption; see the scoped workspace license bundle.
license-file.workspace = true
name = "infinity_v3-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
links = "infinity_backend"

[dependencies]
clap = { workspace = true, optional = true }
hf-hub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
infinity_v3-backend-core = { path = "core" }
infinity-backend-libtorch = { path = "libtorch", optional = true }
infinity-v3-backend-python = { path = "python", optional = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = ["libtorch"]
clap = ["dep:clap", "infinity_v3-backend-core/clap"]
libtorch = ["dep:infinity-backend-libtorch"]
python-backend = ["dep:infinity-v3-backend-python"]
