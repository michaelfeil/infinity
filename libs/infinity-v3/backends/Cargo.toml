[package]
# Fork license adoption; see the scoped workspace license bundle.
license-file.workspace = true
name = "infinity_v3-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
links = "infinity_backend"

[dependencies]
clap = { workspace = true, optional = true }
hf-hub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
infinity_v3-backend-core = { path = "core" }
infinity_v3-backend-candle = { path = "candle", optional = true }
infinity-backend-libtorch = { path = "libtorch", optional = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
experimental-fp8 = ["candle", "infinity_v3-backend-candle/experimental-fp8"]
experimental-fa4 = ["fa4"]
fa4 = ["infinity_v3-backend-candle?/fa4"]
clap = ["dep:clap", "infinity_v3-backend-core/clap"]
candle = ["dep:infinity_v3-backend-candle"]
libtorch = ["dep:infinity-backend-libtorch"]
cuda = ["infinity_v3-backend-candle?/cuda"]
cuda-static-linking = ["infinity_v3-backend-candle?/cuda-static-linking"]
cuda-dynamic-linking = ["infinity_v3-backend-candle?/cuda-dynamic-linking"]
metal = ["infinity_v3-backend-candle?/metal"]
mkl = ["infinity_v3-backend-candle?/mkl"]
accelerate = ["infinity_v3-backend-candle?/accelerate"]
flash-attn = ["infinity_v3-backend-candle?/flash-attn"]
flash-attn-v1 = ["infinity_v3-backend-candle?/flash-attn-v1"]

experimental-deberta = ["infinity_v3-backend-candle?/experimental-deberta"]
