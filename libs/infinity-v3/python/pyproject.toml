[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-v3-python"
version = "3.0.1"
description = "Protocol and discovery helpers for Infinity v3 Python backends"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["infinity_v3_python*"]
