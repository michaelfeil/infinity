
[tool.poetry]
name = "infinity_emb"
version = "0.0.79"
description = "Infinity is a high-throughput, low-latency REST API for serving text-embeddings, reranking models and clip."
authors = ["michaelfeil <noreply@michaelfeil.eu>"]
license = "MIT"
readme = "README.md"
packages = [{include = "infinity_emb"}]
homepage = "https://github.com/michaelfeil/infinity"
repository = "https://github.com/michaelfeil/infinity"
keywords = ["vector", "embedding", "neural", "search", "sentence-transformers"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# NumPy 2 supports the Python 3.13 build and current ONNX Runtime.
numpy = ">=2.2,<3"
huggingface_hub= {version = ">=0.34,<2"}
aiohttp = ">=3.13,<4"
# logging
rich = {version = ">=14,<16", optional=true}
# webserver-only
fastapi = {version = ">=0.115.2,<1", optional=true}
orjson = {version = ">=3.9.8,!=3.10.0", optional=true}
prometheus-fastapi-instrumentator = {version = ">=6.1.0", optional=true}
uvicorn = {version = ">=0.40,<1", optional=true, extras = ["standard"]}
typer = {version = "^0.20.0", optional=true}
click = {version = ">=8.0.0,<9", optional=true}
pydantic = {version = ">=2.4.0,<3", optional=true}
posthog = {version = "*", optional=true}
# backend
# CPU/ROCm containers install matching vendor wheels before the locked dependencies.
torch = {version = ">=2.8,<3", optional=true}
# ST 5 changes model-type detection for subclasses and falls back to mean pooling.
sentence-transformers = {version = ">=4.1,<5", optional=true}
# ColPali 0.3.8 retains ColIdefics2 support and requires Transformers 4.47.
transformers = {version = ">=4.47,<4.48", optional=true, extras=["sentencepiece"]}
# Declare tokenizer dependencies explicitly so Poetry keeps them in model extras.
sentencepiece = {version = ">=0.2.1,<0.3", optional=true}
protobuf = {version = ">=5,<8", optional=true}
# Later converters require the newer Transformers dtype argument.
ctranslate2 = {version = ">=4.6.2,<4.6.3", optional=true}
optimum = {version = ">=2.1,<2.2", optional=true, extras=["onnxruntime"]}
onnx = {version = ">=1.19.1,<2", optional=true}
einops = {version = "*", optional=true}
# vision
pillow = {version = "*", optional=true}
timm = {version = "*", optional=true}
colpali-engine = {version=">=0.3.8,<0.3.9", optional=true}
# openvino
# optimum-intel = {version=">=1.20.0", optional=true, extras=["openvino"]}
# onnxruntime-openvino = {version=">=1.19.0", optional=true}
# openvino = {version="2024.4.0", optional=true}
# openvino-tokenizers = {version="2024.4.0.0", optional=true}


# TorchVision is resolved together with Torch.
torchvision = {version = "*", optional=true}
# cache
diskcache = {version = "*", optional=true}
# gpu
# https://onnxruntime.ai/docs/execution-providers/TensorRT-ExecutionProvider.html:
# Most combinations of onnxruntime and tensorrt are not compatible, and some are broken.
onnxruntime-gpu = {version = ">=1.23.2,<2", optional=true}
tensorrt = {version = "^10.6.0", optional=true}
soundfile = {version=">=0.13,<1", optional=true}


[tool.poetry.scripts]
infinity_emb = "infinity_emb.cli:cli"

[tool.poetry.group.test.dependencies]
pytest = ">=8.4,<10"
pytest-mock = "*"
httpx  = "*"
asgi_lifespan = "*"
anyio = "*"
trio = "*"
coverage = {extras = ["toml"], version = "^7.3.2"}
mypy = ">=1.19,<2"
requests = ">=2.32.5,<3"
types-requests = ">=2.32,<3"
openai = "*" # 1.51.0 works
jinja2 = "*"
jinja2-cli = "*"

# preferred dev dependencies
# Preserve the Torch version used by the container FlashAttention wheel.
torch = "2.8.0"
prometheus-fastapi-instrumentator = ">=7,<9"
fastapi = ">=0.115.2,<1"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.0"

[tool.poetry.group.mkdocs.dependencies]
mkdocs-material = "*"
mike = "*"
mkdocs-swagger-ui-tag = "*"

[tool.poetry.group.lint.dependencies]
ruff = ">=0.15,<0.18"
types-toml = "^0.10.8.1"
types-redis = "^4.3.21.6"
types-pytz = "^2023.3.0.0"
black = ">=26,<27"
types-chardet = "^5.0.4.6"
mypy-protobuf = "^3.0.0"

[tool.poetry.extras]
ct2=["ctranslate2","sentence-transformers","torch","transformers","sentencepiece","protobuf"]
optimum=["optimum","onnx"]
torch=["sentence-transformers","torch","sentencepiece","protobuf"]
einops=["einops"]
logging=["rich"]
cache=["diskcache"]
vision=["colpali-engine","pillow","timm","torchvision","sentencepiece","protobuf"]
# openvino=["onnxruntime-openvino","openvino","openvino-tokenizers"]
audio=["soundfile"]
server=[
    "fastapi",
    "orjson",
    "prometheus-fastapi-instrumentator",
    "posthog",
    "pydantic",
    "rich",
    "click",
    "typer",
    "uvicorn",
]
all=[
    "colpali-engine",
    "ctranslate2",
    "diskcache",
    "einops",
    "fastapi",
    "optimum",
    "onnx",
    "orjson",
    "pillow",
    "prometheus-fastapi-instrumentator",
    "posthog",
    "pydantic",
    "rich",
    "sentence-transformers",
    "sentencepiece",
    "protobuf",
    "timm",
    "torch",
    "torchvision",
    "click",
    "typer",
    "uvicorn",
    "soundfile"
]
# non-default gpu
tensorrt=["tensorrt"]
onnxruntime-gpu=["onnxruntime-gpu"]

[[tool.poetry.source]]
# Explicit vendor indices for local CPU and ROCm development.
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
# used for monkey-patching rocm only
name = "pytorch_rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
priority = "explicit"

[tool.pytest.ini_options]
markers = [
    "performance: tests that measure performance (deselect with '-m \"not performance\"')",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.codespell]
skip = "./tests/data/benchmark,*.lock"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
