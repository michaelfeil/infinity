[tool.poetry]
name = "embed"
version = "0.3.0"
description = "A stable, fast and easy-to-use inference library with a focus on a sync-to-async API"
authors = ["michaelfeil <me@michaelfeil.eu>"]
readme = "README.md"
homepage = "https://github.com/michaelfeil/infinity"
repository = "https://github.com/michaelfeil/infinity"
keywords = ["vector", "embedding", "neural", "search", "sentence-transformers"]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
infinity_emb = {version = ">=0.0.79,<0.1", extras = ["optimum","vision","torch","audio"]}
[tool.poetry.group.test.dependencies]
# Exercise the server from this checkout while retaining a published version constraint.
infinity_emb = {path = "../infinity_emb", develop = true, extras = ["optimum","vision","torch","audio"]}
pytest = ">=8.4,<10"
coverage = {extras = ["toml"], version = "^7.6.3"}
mypy = ">=1.19,<2"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.0"

[tool.poetry.group.lint.dependencies]
ruff = ">=0.15,<0.18"
types-toml = "^0.10.8.1"
types-redis = "^4.3.21.6"
types-pytz = "^2023.3.0.0"
black = ">=26,<27"
types-chardet = "^5.0.4.6"
mypy-protobuf = "^3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
