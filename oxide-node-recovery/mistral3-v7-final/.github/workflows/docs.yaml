name: docs-gh-pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'libs/infinity_emb/**'
      - 'libs/infinity-v3/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'libs/infinity-v3/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  INFINITY_DOCS_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, '0.') || startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, '3.') || startsWith(github.event.release.tag_name, 'v3.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --config-file docs/mkdocs.yml
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/site/

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Publish documentation
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$EVENT_NAME" = release ]; then
            version="${RELEASE_TAG#v}"
            if ! [[ "$version" =~ ^(0|3)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported documentation release tag: $RELEASE_TAG"
              exit 1
            fi
            args=("$version")
            if [ "$RELEASE_PRERELEASE" != true ] && [[ "$version" != *-* ]]; then
              if [[ "$version" = 3.* ]]; then
                args+=(latest)
              else
                args+=(latest-v2)
              fi
              args+=(--update-aliases --alias-type=redirect)
            fi
          else
            args=(main)
          fi
          # Retry concurrent gh-pages pushes instead of dropping pending releases.
          for attempt in 1 2 3; do
            git fetch origin main gh-pages
            if [ "$EVENT_NAME" != release ] && [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
              echo "Skipping superseded main documentation build."
              exit 0
            fi
            git branch --force gh-pages origin/gh-pages
            if mike deploy --config-file docs/mkdocs.yml --push "${args[@]}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
